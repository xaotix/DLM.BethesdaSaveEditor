name: Build and Release DLM.BethesdaSaveEditor

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild DLM.BethesdaSaveEditor.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /nologo

      - name: Package Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "DLM.BethesdaSaveEditor\bin\Release\DLM.BethesdaSaveEditor.exe" "dist\" -Force
          Compress-Archive -Path "dist\DLM.BethesdaSaveEditor.exe" -DestinationPath "dist\DLM.BethesdaSaveEditor.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLM.BethesdaSaveEditor
          path: |
            dist/DLM.BethesdaSaveEditor.exe
            dist/DLM.BethesdaSaveEditor.zip

      - name: Create GitHub Release (on tag v* or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: DLM.BethesdaSaveEditor ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }} (Beta)
          body: |
            > **BETA WARNING:** This software is currently in **Beta** and may contain bugs or unexpected issues. Always keep a manual backup of your save files before editing!

            ### Download
            - **`DLM.BethesdaSaveEditor.exe`** — Standalone Windows executable (.NET Framework 4.8, no installer or external DLLs required).
            - **`DLM.BethesdaSaveEditor.zip`** — Zipped copy of the executable.
          generate_release_notes: true
          files: |
            dist/DLM.BethesdaSaveEditor.exe
            dist/DLM.BethesdaSaveEditor.zip

